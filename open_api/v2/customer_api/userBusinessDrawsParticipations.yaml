swagger: "2.0"
info:
  version: 1.0.0
  title: Kangaroo Customer Api
  license:
    name: MIT
host: com.kangaroo.com
basePath: /v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
paths:
  /users/me/businesses/{businessId}/draws/participation:
    get:
      summary: Get a list of draws participations for this user for a specific business.
      operationId: getUserBusinessDrawsParticipations
      tags:
        - userBusinessDrawsParticipations
      parameters:
        - in: path
          name: businessId
          required: true
          type: string
      responses:
        "200":
          description: User draws participations for a specific business.
          schema:
            $ref: 'schemas/draws/participations.yaml#/definitions/Participations'
