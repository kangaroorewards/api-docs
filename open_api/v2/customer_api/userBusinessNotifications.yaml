swagger: "2.0"
info:
  version: 1.0.0
  title: Kangaroo Customer Api
  license:
    name: MIT
host: com.kangaroo.com
basePath: /v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
paths:
  /users/me/businesses/{businessId}/notifications:
    get:
      summary: Get a list of notifications available to this user by specific business.
      operationId: getUserBusinessNotifications
      tags:
        - userBusinessNotifications
      parameters:
        - in: path
          name: businessId
          required: true
          type: string
      responses:
        "200":
          description: User notifications list
          schema:
            $ref: 'schemas/notifications/notifications.yaml#/definitions/UserBusinessNotificationsResponse'